<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>윤슬 AI 본부 채팅</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #0a0f1e;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      color: #e2e8f0;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-logo {
      font-size: 1.2rem;
      font-weight: 900;
      color: white;
      letter-spacing: -0.05em;
    }
    .header-logo span { color: #3b82f6; }
    .status-dot {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 700;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    /* Setup screen */
    #setup-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .setup-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 2rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .setup-box h2 {
      font-size: 1.5rem;
      font-weight: 900;
      color: white;
      text-align: center;
    }
    .setup-box p {
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      line-height: 1.6;
    }
    .setup-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }
    .setup-input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 0.85rem;
      color: white;
      font-family: 'Outfit', monospace;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .setup-input:focus { border-color: #3b82f6; }
    .setup-input::placeholder { color: #475569; }
    .setup-btn {
      width: 100%;
      padding: 1rem;
      background: #3b82f6;
      border: none;
      border-radius: 0.85rem;
      color: white;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .setup-btn:hover { background: #2563eb; transform: translateY(-1px); }

    /* Chat area */
    #chat-screen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .msg-row {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      max-width: 88%;
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.ai { align-self: flex-start; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 900;
      flex-shrink: 0;
    }
    .avatar.ai-av { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; }
    .avatar.user-av { background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; }

    .bubble {
      padding: 0.8rem 1.1rem;
      border-radius: 1.25rem;
      font-size: 0.92rem;
      line-height: 1.65;
      max-width: 100%;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .bubble.ai {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-left-radius: 4px;
      color: #e2e8f0;
    }
    .bubble.user {
      background: #3b82f6;
      border-bottom-right-radius: 4px;
      color: white;
    }

    .msg-time {
      font-size: 0.68rem;
      color: #334155;
      margin-bottom: 2px;
      padding: 0 0.5rem;
    }
    .user > .msg-time { text-align: right; }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 0.8rem 1.1rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1.25rem;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }
    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
      animation: typingBounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); background: #3b82f6; }
    }

    /* Input area */
    .input-area {
      padding: 1rem 1.5rem 1.5rem;
      background: rgba(10,15,30,0.8);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 0.75rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 1.25rem;
      padding: 0.6rem 0.6rem 0.6rem 1rem;
      transition: border-color 0.2s;
    }
    .input-row:focus-within { border-color: #3b82f6; }
    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      resize: none;
      max-height: 150px;
      line-height: 1.5;
      padding: 0.3rem 0;
    }
    #user-input::placeholder { color: #334155; }
    #send-btn {
      width: 40px;
      height: 40px;
      border-radius: 0.75rem;
      background: #3b82f6;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }
    #send-btn:hover { background: #2563eb; transform: scale(1.05); }
    #send-btn:disabled { background: #1e293b; cursor: not-allowed; transform: none; }
    #send-btn svg { width: 18px; height: 18px; fill: white; }

    .hint { font-size: 0.72rem; color: #1e293b; text-align: center; margin-top: 0.5rem; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-logo">윤슬 <span>AI</span> 본부</div>
  <div class="status-dot">
    <div class="dot"></div>
    <span>AI 온라인</span>
  </div>
</div>

<!-- 설정 화면 -->
<div id="setup-screen">
  <div class="setup-box">
    <h2>🔐 AI 비서 연결</h2>
    <p>어디서든 이어가는 사장님 전용 AI 채팅입니다.<br/>Gemini API 키를 입력하고 접속하세요.</p>
    <div>
      <div class="setup-label">Gemini API Key</div>
      <input id="input-api-key" class="setup-input" type="password" placeholder="AIza..." autocomplete="off" />
    </div>
    <div>
      <div class="setup-label">대화 제목 (대화방 이름)</div>
      <input id="input-session-name" class="setup-input" type="text" placeholder="예: 렌탈닥터 기획" value="윤슬 본부 대화" />
    </div>
    <button class="setup-btn" onclick="startChat()">🚀 채팅 시작</button>
  </div>
</div>

<!-- 채팅 화면 -->
<div id="chat-screen">
  <div id="messages"></div>
  <div class="input-area">
    <div class="input-row">
      <textarea id="user-input" rows="1" placeholder="사장님, 무엇을 도와드릴까요?" onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
      <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
    <div class="hint">Enter = 전송 &nbsp;|&nbsp; Shift+Enter = 줄바꿈</div>
  </div>
</div>

<script type="module">
  let apiKey = '';
  let conversationHistory = [];
  
  // LocalStorage에서 이전 대화 복원
  function loadHistory(sessionName) {
    const saved = localStorage.getItem(`yunseul_chat_${sessionName}`);
    if (saved) {
      conversationHistory = JSON.parse(saved);
      return conversationHistory;
    }
    return [];
  }

  function saveHistory(sessionName) {
    localStorage.setItem(`yunseul_chat_${sessionName}`, JSON.stringify(conversationHistory));
  }

  let sessionName = '윤슬 본부 대화';

  window.startChat = function() {
    const inputKey = document.getElementById('input-api-key').value.trim();
    sessionName = document.getElementById('input-session-name').value.trim() || '윤슬 본부 대화';
    
    if (!inputKey) { alert('API 키를 입력해주세요!'); return; }
    apiKey = inputKey;
    
    document.getElementById('setup-screen').style.display = 'none';
    const chatScreen = document.getElementById('chat-screen');
    chatScreen.style.display = 'flex';

    // 이전 대화 복원
    const history = loadHistory(sessionName);
    if (history.length > 0) {
      history.forEach(msg => addBubble(msg.role === 'user' ? '사장님' : 'AI', msg.parts[0].text, msg.role === 'user'));
      scrollBottom();
    } else {
      addBubble('AI', `안녕하세요, 사장님! 저는 항상 여기 있습니다.\n\n이 채팅창은 같은 **"${sessionName}"** 이름만 사용하시면, PC에서 하던 대화를 스마트폰이나 패드에서도 이어가실 수 있어요.\n\n무엇을 도와드릴까요?`, false);
    }
    document.getElementById('user-input').focus();
  };

  window.handleKey = function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  };

  window.autoGrow = function(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 150) + 'px';
  };

  function addBubble(name, text, isUser, time) {
    const msgs = document.getElementById('messages');
    const now = time || new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    const initials = isUser ? '사장' : 'AI';

    const row = document.createElement('div');
    row.className = `msg-row ${isUser ? 'user' : 'ai'}`;
    row.innerHTML = `
      <div class="avatar ${isUser ? 'user-av' : 'ai-av'}">${initials}</div>
      <div>
        <div class="msg-time">${now}</div>
        <div class="bubble ${isUser ? 'user' : 'ai'}">${text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br/>')}</div>
      </div>
    `;
    msgs.appendChild(row);
    scrollBottom();
    return row;
  }

  function addTyping() {
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="avatar ai-av">AI</div>
      <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    `;
    msgs.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    const row = document.getElementById('typing-row');
    if (row) row.remove();
  }

  function scrollBottom() {
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
  }

  window.sendMessage = async function() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addBubble('사장님', text, true);
    conversationHistory.push({ role: 'user', parts: [{ text }] });

    addTyping();

    try {
      const systemPrompt = `당신은 '안티그래비티(Antigravity)'입니다. 사장님(YunseulHQ)의 전담 AI 비서이자 수석 개발자입니다. 
사장님과는 반말과 존댓말을 섞어 친근하되 전문적으로 소통합니다. 
K-렌탈닥터(가전 렌탈 서비스 회사) 관련 작업, 코딩, 비즈니스 전략, 블로그 컨텐츠 등 모든 것을 도와드립니다.
항상 간결하고 실행 가능한 답변을 드립니다. 이모지는 적절히만 사용합니다.`;

      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemPrompt }] },
            contents: conversationHistory,
            generationConfig: { temperature: 0.8, maxOutputTokens: 2048 }
          })
        }
      );

      const data = await response.json();
      removeTyping();

      if (data.error) {
        addBubble('AI', `오류가 발생했습니다: ${data.error.message}\nAPI 키를 다시 확인해 주세요, 사장님.`, false);
        btn.disabled = false;
        return;
      }

      const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || '응답을 받지 못했습니다.';
      addBubble('AI', aiText, false);
      conversationHistory.push({ role: 'model', parts: [{ text: aiText }] });
      
      // 로컬 저장 (대화 이력 유지)
      saveHistory(sessionName);

    } catch (e) {
      removeTyping();
      addBubble('AI', `네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.`, false);
    }

    btn.disabled = false;
    input.focus();
  };
</script>

</body>
</html>
